<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Work+Sans&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="culturama-favico.png">
    <title>projeto-formulario</title>
</head>
<body>
    
    <header>
        <img src="img/logo-culturama.png" alt="logo culturama">
        <h1>Formulario online</h1>
    </header>
    <main>
    <section>

        <form action="" method="get">

            <fieldset>
                   <!-- Dados Pessoais -->

                <legend>Dados pessoais</legend>
                <label for="userName">Nome</label> 
                <input id="userName" type="text" name="userName" required>
                <br>
                <label for="userAge">Idade</label>
                <input id="userAge" type="number" name="userAge" min="1" max="100" required>
                <br>
                <label for="userBirthDate">Data de nascimento</label>
                <input id="userBirthDate" type="date" name="userBirthDate">
                <br>
                <label for="userEmail">Email</label>
                <input id="userEmail" type="email" name="Email">
                <br>
                <label for="userPhoneNumber">Telefone</label>
                <input id="userPhoneNumber" type="tel" name="userPhoneNumber" pattern="(0-9)" placeholder="DDD+ numero sem espaco ou hifen">
                <br>
                <label for="userImage">Uploud de foto</label>
                <input id="userImage" type="file" accept="image/*" name="userImage">
                
            </fieldset>

            <fieldset>
                   <!-- Perfil -->
                
                <legend>Perfil</legend>
                <p>Gênero</p>
                <input type="radio" name="userGender" value="Feminino">
                <label for="userGender">Feminino</label>
                <input type="radio" name="userGender" value="Masculino">
                <label for="userGender">Masculino</label>
                <input type="radio" name="userGender" value="Prefiro não informar">
                <label for="userGender">Prefiro não informar</label>
                <br>

                <label for="MaritalStatus">Estado Civil</label>
                <select name="MaritalStatus">
                    <option value="NotInformed">Selecione...</option>
                    <option value="Solteiro">Solteiro</option>
                    <option value="Casado">Casado</option>
                    <option value="Divorciado">Divorciado</option>
                    <option value="União estável">União estável</option>
                </select>
                <br>

                <label for="userState">Estado</label>
                <select name="userState">
                    <option value="NaoInformado">selecione...</option>
                    <option value="State">Acre</option>
                    <option value="State">Amapá</option>
                    <option value="State">Amazonas</option>
                    <option value="State">Bahia</option>
                    <option value="State">Ceará</option>
                    <option value="State"> Distrito Federal</option>
                    <option value="State">Espírito Santo</option>
                    <option value="State">Goiás</option>
                    <option value="State">Maranhão</option>
                    <option value="State">Mato Grosso</option>
                    <option value="State">Mato Grosso do Sul</option>
                    <option value="State">Minas Gerais</option>
                    <option value="State">Pará</option>
                    <option value="State">Paraíba</option>
                    <option value="State">Paraná</option>
                    <option value="State">Pernambuco</option>
                    <option value="State">Piauí</option>
                    <option value="State">Rio de Janeiro</option>
                    <option value="State">Rio Grande do Norte</option>
                    <option value="State">Rio Grande do Sul</option>
                    <option value="State">Rondônia</option>
                    <option value="State">Roraima</option>
                    <option value="State">Santa Catarina</option>
                    <option value="State">São Paulo</option>
                    <option value="State">Sergipe</option>
                    <option value="State">Tocantins</option>
                    <option value="State">Alagoas</option>
                </select>

                <label for="userCity">Cidade</label>
                <input id="userCity" type="text" name="userCity">

            </fieldset>

            <fieldset>
                   <!-- HABITOS-->

                <legend>Hábitos</legend>    
                <p>Redes Sociais:</p>
                <input id="social" type="checkbox" name="social" value="Instagram">
                <label for="social">Instagram</label>
                <br>
                <input id="Facebook" type="checkbox" name="social" value="Facebook">
                <label for="Facebook">Facebook</label>
                <br>
                <input id="Linkedin" type="checkbox" name="social" value="Linkedin">
                <label for="Linkedin">Linkedin</label>
                <br>
                <input id="X" type="checkbox" name="Social" value="X">
                <label for="X">X</label>
                <br>
                <label for="styleMusic">Estilo musical</label>
                <input list="StyleTypes" id="StyleMusic" type="text" name="StyleMusic">
                <datalist id="StyleTypes">
                    <option value="Rock">
                    <option value="Pop">
                    <option value="Internacional">
                    <option value="MPB">
                </datalist>
                <br>
                <label for="FavoriteColor">Cor favorita</label>
                <input id="FavoriteColor" type="color" name="FavoriteColor">
            
            </fieldset>

            <fieldset>
                   <!-- OPINIÂO -->

                <legend>Opinião</legend>
                <p>O que você achou da qualidade do nosso serviço?</p>
                <input id="Ótima" type="radio" name="userOpinion" value="Ótima">
                <label for="Ótima">Ótima</label>
                <br>
                <input id="Boa" type="radio" name="userOpinion" value="Boa">
                <label for="Boa">Boa</label>
                <br>
                <input id="regular" type="radio" name="userOpinion" value="regular">
                <label for="regular">regular</label>
                <br>
                <input id="ruim" type="radio" name="userOpinion" value="ruim">
                <label for="ruim">ruim</label>
                <br>
                <label for="Comment">Escreva sua opinião</label>
                <textarea id="Comment" name="userComment" placeholder="Digite aqui..."></textarea>

            </fieldset>

            <fieldset>
                  <!-- Confirmações e consentimentos-->
                   
                <legend>Confirmações</legend>
                <input type="checkbox" name="userLgpd" id="userLgpd" value="accepted" required>
                <label for="userLgpdTerm">Eu aceito participar da pesquisa</label>
                <br>
                <input type="checkbox" name="userGetResult" id="GetResult" value="accepted">
                <label for="userLgpdTerm">aceito receber o resultado por email</label>

            </fieldset>
            
            <button type="submit">Enviar</button>
            <button type="reset">Limpar</button>
        </form>

    </section>
    </main>
</body>
</html>
